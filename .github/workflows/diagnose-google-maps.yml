name: Diagnose Google Maps

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Maps configuration
        id: maps
        shell: bash
        env:
          API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
        run: |
          set +x
          key_state=missing
          map_id_state=missing
          http_status=not-tested
          api_error=none-detected

          if [ -n "$API_KEY" ]; then
            key_state=present
            http_status=$(curl -sS -o /tmp/maps.js -w '%{http_code}' \
              -H 'Referer: https://antonnhamezaa-tech.github.io/ideal/' \
              "https://maps.googleapis.com/maps/api/js?key=${API_KEY}&v=weekly" || true)
            detected=$(grep -oE 'RefererNotAllowedMapError|InvalidKeyMapError|ApiNotActivatedMapError|BillingNotEnabledMapError|ExpiredKeyMapError|DeletedApiProjectMapError' /tmp/maps.js 2>/dev/null | head -n 1 || true)
            if [ -n "$detected" ]; then api_error="$detected"; fi
          fi

          if [ -n "$MAP_ID" ]; then map_id_state=present; fi

          echo "key_state=$key_state" >> "$GITHUB_OUTPUT"
          echo "map_id_state=$map_id_state" >> "$GITHUB_OUTPUT"
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          echo "api_error=$api_error" >> "$GITHUB_OUTPUT"

      - name: Report diagnostics
        uses: actions/github-script@v7
        env:
          KEY_STATE: ${{ steps.maps.outputs.key_state }}
          MAP_ID_STATE: ${{ steps.maps.outputs.map_id_state }}
          HTTP_STATUS: ${{ steps.maps.outputs.http_status }}
          API_ERROR: ${{ steps.maps.outputs.api_error }}
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maps-diagnostics',
              per_page: 1,
            });
            if (!issues.data.length) return;
            const body = [
              'MAPS_DIAGNOSTICS_RESULT',
              `API key secret: ${process.env.KEY_STATE}`,
              `Map ID secret: ${process.env.MAP_ID_STATE}`,
              `Maps JavaScript response: ${process.env.HTTP_STATUS}`,
              `Detected API error: ${process.env.API_ERROR}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              body,
            });
