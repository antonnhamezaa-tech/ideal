name: Implement bedroom count filter

on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  implement:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN_BEDROOM_FILTER_IMPLEMENTATION'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply implementation
        run: python scripts/implement-bedroom-filter.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          VITE_BASE_PATH: /ideal/

      - name: Verify implementation
        shell: bash
        run: |
          grep -Fq "bedroomCount" src/types.ts
          grep -Fq "params.get('habitaciones')" src/lib/mobile-search.ts
          grep -Fq "roomCountOptions" src/components/mobile-search-results.tsx
          grep -Fq "m2-results-filter__pair > label:focus-within" src/mobile-search-results.css

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/data/listings.ts src/lib/listings.ts src/lib/mobile-search.ts src/pages/PublishPage.tsx src/components/mobile-search-results.tsx src/mobile-search-results.css
          git commit -m 'Fix numeric filter focus and add bedroom count filtering'
          git push origin HEAD:main

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `BEDROOM_FILTER_RESULT: ${{ job.status }}\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
