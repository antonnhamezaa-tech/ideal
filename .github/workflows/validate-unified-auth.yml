name: Validate unified authentication

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN_AUTH_VALIDATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Remove legacy login translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/contexts/i18n-context.tsx')
          lines = path.read_text(encoding='utf-8').splitlines()
          obsolete = (
              "  'Bienvenido de nuevo':",
              "  'Accede para continuar donde lo dejaste.':",
              "  'Recuérdame':",
              "  '¿Has olvidado la contraseña?':",
              "  '¿No tienes cuenta?':",
              "  'Mostrar contraseña':",
              "  'Ocultar contraseña':",
              "  'Revisa el email y vuelve a intentarlo.':",
          )
          cleaned = [line for line in lines if not line.startswith(obsolete)]
          path.write_text('\n'.join(cleaned) + '\n', encoding='utf-8')
          PY

          if ! git diff --quiet -- src/contexts/i18n-context.tsx; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/contexts/i18n-context.tsx
            git commit -m 'Remove legacy login translations'
            git push origin HEAD:main
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect authentication implementation
        id: auth
        continue-on-error: true
        shell: bash
        run: |
          matches="$(grep -RInE --exclude-dir=node_modules --exclude-dir=.git 'Bienvenido de nuevo|Cuentas demo|default: module\.LoginPage' src || true)"
          unified=no
          route=no
          grep -Fq "@/pages/UnifiedAuthPage" src/App.tsx && unified=yes
          grep -Fq 'path="acceso" element={<LoginPage />}' src/App.tsx && route=yes
          {
            echo 'matches<<EOF'
            echo "$matches"
            echo 'EOF'
            echo "unified=$unified"
            echo "route=$route"
          } >> "$GITHUB_OUTPUT"
          test -z "$matches" && test "$unified" = yes && test "$route" = yes

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
        env:
          VITE_BASE_PATH: /ideal/

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'AUTH_VALIDATION_DIAGNOSTICS',
              `Auth scan: ${{ steps.auth.outcome }}`,
              `Unified import: ${{ steps.auth.outputs.unified }}`,
              `Unified route: ${{ steps.auth.outputs.route }}`,
              `Legacy matches: ${{ steps.auth.outputs.matches }}`,
              `Lint: ${{ steps.lint.outcome }}`,
              `Typecheck: ${{ steps.typecheck.outcome }}`,
              `Build: ${{ steps.build.outcome }}`,
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

      - name: Enforce successful validation
        if: always()
        shell: bash
        run: |
          test '${{ steps.auth.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
